name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install skopeo & jq
      run: sudo apt update && sudo apt install -y skopeo jq

    - name: Sync images to ACR via skopeo
      run: |
        # 登录目标阿里云仓库凭证（skopeo全局cred）
        export DEST_CREDS="${ALIYUN_REGISTRY_USER}:${ALIYUN_REGISTRY_PASSWORD}"

        declare -A duplicate_images
        declare -A temp_map

        # 第一轮：检测重名镜像
        while IFS= read -r line || [ -n "$line" ]; do
          [[ -z "$line" ]] && continue
          if echo "$line" | grep -q '^\s*#'; then continue; fi
          image=$(echo "$line" | awk '{print $NF}')
          image="${image%%@*}"
          image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
          name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
          name_space="${name_space}_"
          image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

          if [[ -n "${temp_map[$image_name]}" ]]; then
            if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
              echo "duplicate image name: $image_name"
              duplicate_images[$image_name]="true"
            fi
          else
            temp_map[$image_name]="$name_space"
          fi
        done < images.txt

        # 第二轮：skopeo直接跨registry复制，不本地pull
        while IFS= read -r line || [ -n "$line" ]; do
          [[ -z "$line" ]] && continue
          if echo "$line" | grep -q '^\s*#'; then continue; fi

          raw_line="$line"
          platform=$(echo "$raw_line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
          image=$(echo "$raw_line" | awk '{print $NF}')
          image="${image%%@*}"

          image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
          name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
          image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

          name_space_prefix=""
          if [[ -n "${duplicate_images[$image_name]}" ]]; then
            if [[ -n "${name_space}" ]]; then
              name_space_prefix="${name_space}_"
            fi
          fi

          if [ -z "$platform" ]; then
            platform_prefix=""
            src_image="docker://${image}"
          else
            platform_prefix="${platform//\//_}_"
            src_image="docker://${image}"
          fi

          new_image="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${platform_prefix}${name_space_prefix}${image_name_tag}"
          echo "===== Sync $src_image  --> docker://$new_image ====="
          echo "platform: $platform"

          # skopeo copy，支持--platform，不需要本地落盘
          if [ -z "$platform" ]; then
            skopeo copy --dest-creds "${DEST_CREDS}" \
              "$src_image" \
              "docker://${new_image}"
          else
            skopeo copy --platform "${platform}" --dest-creds "${DEST_CREDS}" \
              "$src_image" \
              "docker://${new_image}"
          fi
        done < images.txt
